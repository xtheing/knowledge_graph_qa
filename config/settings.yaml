# 知识图谱问答系统配置文件

# Neo4j 图数据库配置
neo4j:
  uri: "bolt://localhost:7687"
  user: "neo4j"
  password: "password"
  max_connection_lifetime: 3600
  max_connection_pool_size: 50

# Chroma 向量数据库配置
chroma:
  persist_directory: "./data/chroma_db"
  collection_name: "knowledge_entities"
  embedding_function: "openai"
  distance_metric: "cosine"

# OpenAI API配置
openai:
  model: "gpt-4"
  embedding_model: "text-embedding-3-small"
  temperature: 0.3
  max_tokens: 2000
  api_key: null  # 从环境变量读取

# 知识抽取配置
extraction:
  batch_size: 5
  max_chunks_per_paper: 50
  entity_types:
    - Concept
    - Method
    - Dataset
    - Model
    - Metric
    - Result
    - Paper
  relation_types:
    - BELONGS_TO
    - USES
    - BASED_ON
    - ACHIEVES
    - COMPARES_TO
    - CITES
    - PART_OF
    - LEADS_TO

# 检索配置
retrieval:
  vector_top_k: 10
  graph_depth: 2
  min_similarity_score: 0.7
  max_context_length: 4000

# 问答配置
qa:
  model: "gpt-4"
  temperature: 0.3
  max_context_entities: 30
  enable_citations: true

# API服务配置
api:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 1

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/app.log"