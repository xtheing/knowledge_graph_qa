version: '3.8'

services:
  # Neo4j图数据库
  neo4j:
    image: neo4j:5-community
    container_name: neo4j-knowledge
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc", "gds"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - kg-network
    restart: unless-stopped

  # 知识图谱API服务
  kg-api:
    build: .
    container_name: kg-api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHROMA_DIR=/app/data/chroma_db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - neo4j
    networks:
      - kg-network
    restart: unless-stopped
    command: python -m src.api.main

  # 前端服务
  frontend:
    build: ./frontend
    container_name: kg-frontend
    ports:
      - "80:80"
    depends_on:
      - kg-api
    networks:
      - kg-network
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  kg-network:
    driver: bridge